version: 1
disable_existing_loggers: false

formatters:
  file_fmt:
    (): reader.logging.logging_setup.TzAwareFormatter
    format: "%(asctime)s | %(levelname)s | %(filename)s:%(lineno)d | %(message)s"

handlers:
  console:
    class: rich.logging.RichHandler
    level: INFO
    rich_tracebacks: true
    tracebacks_show_locals: false
    markup: true
    omit_repeated_times: true  # net to repeat the same message

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    filename: "app.log"
    mode: "a"
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    formatter: file_fmt
    encoding: "utf-8"

root:
  level: INFO
  handlers: [console, file]

loggers:
  reader:
    level: DEBUG
    propagate: false
    handlers: [console, file]
