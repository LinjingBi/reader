run:
  month_key: "month=2025-02"                 # keep the exact query key shape
  log_config_path: "/Users/bii/reader/reader/src/reader/logging/config.yaml"  # Absolute path to logging config file
  log_file_path: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/artifacts/hf_data.log"

sources:
  hf:
    daily_papers_api: "https://huggingface.co/api/daily_papers"
    # paper_page_base_url: "https://huggingface.co/papers/"
    paper_page_base_url: "https://arxiv.org/abs/"
    output_json: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/data/papers_report.json"        # used only for optional dump

algos:
  embedding:
    model: "BAAI/bge-small-en-v1.5"
    modes: ["B", "C"]
    top_n_keywords: 10

  clustering:
    method: "kmeans"
    k_candidates: [4, 5]
    random_seed: 42

  paperchunk:
    rules_path: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/config/paper_chunk_rules.yaml"
    paper_parser_max_workers: 8  # Number of worker threads for paper parsing executor

cluster_summarization:
  top_n: 10  # Max papers per cluster to include in LLM summarization prompt
  llm_gemini:
    model: "models/gemini-2.5-flash-lite"
    temperature: 0.2
    max_tokens: 2500
    api_key_env: "GEMINI_API_KEY"
    gemini_rpm_limit: 15
    gemini_tpm_limit: 250000
    gemini_call_max_workers: 5  # Number of worker threads for cluster summarization LLM call executor, better match the average cluster number per run

  prompt_template: "enrich_p0_per_cluster_gemini.txt"  # Relative to hf_data/prompts/

memo:
  bin: "/Users/bii/reader/memory_cli/target/debug/memo"
  db_path: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/db/memo_chunk.sqlite"  # optional, if not provided, a temporary database will be created
  # db_path: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/db/memo.sqlite"  # optional, if not provided, a temporary database will be created
  db_schema_path: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/db/paper_chunk.sql" # optional, if not provided, no schema will be applie
  # db_schema_path: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/db/fresh_paper.sql" # optional, if not provided, no schema will be applied
  timeout_sec: 60

outputs:
  # best_cluster_text_report_path_template: "best_clustering_md_reports_{month_key}.md"
  # best_cluster_report_path_template: "/Users/bii/reader/paper_chunk/clusters_data/best_clustering_{month_key}.json"
  papers_scoring_summary_report: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/artifacts/papers_scoring_summary_report_{month_key}.json"
  paper_scoring_debug_heading_events: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/artifacts/paper_scoring_debug_heading_events_{month_key}.jsonl"
  cluster_summarization_events: "/Users/bii/reader/reader/src/reader/pipelines/hf_data/artifacts/cluster_summarization_events_{month_key}.jsonl"

task:
  fetch_hf_data: true
  cluster_summarization: true
  paper_chunk: true