run:
  source: "hf_monthly"                      # Data source identifier
  period_start: "2025-01-01"                 # Period start date in YYYY-MM-DD format
  period_end: "2025-01-31"                  # Period end date in YYYY-MM-DD format
  log_config_path: "/Users/bii/reader/reader/src/reader/logging/config.yaml"  # Absolute path to logging config file
  log_file_path: "/Users/bii/reader/reader/src/reader/pipelines/report_generation/artifacts/report_generation.log"

memo:
  bin: "/Users/bii/reader/memory_cli/target/debug/memo"
  db_path: "/Users/bii/reader/reader/src/reader/pipelines/report_generation/db/memo_report.sqlite"  # optional, if not provided, a temporary database will be created
  db_schema_path: "/Users/bii/reader/reader/src/reader/pipelines/report_generation/db/report.sql"  # optional, if not provided, no schema will be applied
  timeout_sec: 60

report_generation:
  topic_resolver_threshold: 0.98
  llm_gemini:
    model: "models/gemini-2.5-pro"
    temperature: 0.2
    max_tokens: 2500
    api_key_env: "GEMINI_API_KEY"  # Environment variable name for API key
    gemini_rpm_limit: 5           # Requests per minute limit
    gemini_tpm_limit: 250000       # Tokens per minute limit
    gemini_call_max_workers: 2     # Optional: worker threads for non-blocking async LLM calls
