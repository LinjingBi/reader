[project]
name = "pdf-intro-bench"
version = "0.1.0"
description = "Benchmark PDF intro extraction across multiple libraries."
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "pymupdf4llm>=0.0.11",
  "pandas>=2.2.0",
  "aiohttp>=3.9.0",
]

[project.scripts]
pdf-intro-bench = "benchmark_intro_extract:main"

